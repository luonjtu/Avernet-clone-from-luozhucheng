name: Sync from upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/repo)'
        required: true
        default: 'luozhucheng/Avernet'
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: true
        default: 'dev'
      target_branch:
        description: 'Target branch to sync to'
        required: true
        default: 'dev'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git || true
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Try merge upstream
        id: merge
        run: |
          git checkout ${{ github.event.inputs.target_branch }}
          git merge upstream/${{ github.event.inputs.upstream_branch }} --no-commit --no-ff || echo "merge_failed=true" >> $GITHUB_OUTPUT

      - name: Check for conflicts
        id: check_conflicts
        run: |
          if git ls-files -u | grep -q .; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      - name: Push if no conflicts
        if: steps.check_conflicts.outputs.has_conflicts == 'false'
        run: |
          git commit -m "Sync from upstream: ${{ github.event.inputs.upstream_repo }}:${{ github.event.inputs.upstream_branch }}"
          git push origin ${{ github.event.inputs.target_branch }}
          echo "Successfully synced without conflicts"

      - name: Create sync branch if conflicts
        if: steps.check_conflicts.outputs.has_conflicts == 'true'
        run: |
          git merge --abort
          git checkout -b sync/upstream-${{ github.run_number }}
          git merge upstream/${{ github.event.inputs.upstream_branch }} --no-commit || true

      - name: Create Pull Request for conflicts
        if: steps.check_conflicts.outputs.has_conflicts == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/upstream-${{ github.run_number }}
          base: ${{ github.event.inputs.target_branch }}
          title: "Sync from upstream: ${{ github.event.inputs.upstream_repo }}"
          body: |
            ## Automated Sync from Upstream
            
            This PR syncs changes from upstream repository `${{ github.event.inputs.upstream_repo }}:${{ github.event.inputs.upstream_branch }}` to `${{ github.event.inputs.target_branch }}`.
            
            **⚠️ This PR has merge conflicts that need to be resolved manually.**
            
            ### Next Steps
            1. Review the conflicts below
            2. Resolve conflicts in each file
            3. Commit the resolved changes
            4. Merge this PR
            
            ### Conflict Details
            
            ```
            ${{ steps.merge.outputs.merge_output }}
            ```
            
            ---
            *This PR was automatically created by the sync workflow.*
          draft: true
          labels: |
            sync
            automated
            conflicts